[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "techdocs-workbench"
version = "0.1.0"
description = "Bilingual technical-document retrieval with transactional index lifecycle"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "numpy==2.3.5",
  "onnxruntime==1.31.0", "tokenizers==0.23.3", "sentencepiece==0.2.1",
  "argon2-cffi==25.1.0", "httpx==0.28.1", "lxml==6.1.1"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "psutil>=6,<8", "ruff>=0.11,<1"]

[tool.setuptools.packages.find]
include = ["app*", "tools*"]

[tool.setuptools.package-data]
app = ["web/*", "v1-schema.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
